<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e12">
  <meta name="description" content="選好你的車，依改裝方向看建議套組，比較各品牌改裝品、參考價與合法性提醒，整理成可分享的改裝清單。">
  <title>改裝規劃室｜選車、比較改裝品、整理清單</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5a36'/%3E%3Cpath d='M7 20l5-9h8l5 9' stroke='%230c0e12' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>
  <header class="topbar" id="topbar">
    <div class="topbar__row">
      <button class="icon-btn" id="backBtn" type="button" aria-label="回上一步" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">改裝規劃室</span>
      </div>
      <span class="step-count" id="stepCount"></span>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="目前已選的車"></nav>
  </header>

  <div class="sample-banner" id="sampleBanner" hidden></div>

  <main id="main" class="main" tabindex="-1">
    <div class="loading" id="loading">
      <span class="spinner" aria-hidden="true"></span>
      <p>正在載入車款與改裝品資料…</p>
    </div>
  </main>

  <footer class="site-footer" id="footer">
    <p>價格皆為參考價，實際價格以店家為準。購買前請向廠商確認適配。</p>
    <p id="footerDisclaimer">合法性標記僅為提醒，不代表保證合法或違規，請以監理單位與合格廠商說明為準。</p>
    <p class="affiliate-note" id="affiliateNote" hidden>部分連結為分潤連結，不影響你的購買價格</p>
  </footer>

  <div class="dock" id="dock" hidden>
    <button class="dock__btn" id="dockBtn" type="button" aria-haspopup="dialog">
      <span class="dock__count" id="dockCount">0</span>
      <span class="dock__text">
        <span class="dock__label"><span id="dockLabel">我的改裝清單</span> <span class="dock__warn" id="dockWarn" hidden></span></span>
        <span class="dock__total" id="dockTotal">還沒有加入改裝品</span>
      </span>
      <span class="dock__cta">查看</span>
    </button>
  </div>

  <dialog class="sheet" id="slotSheet" aria-labelledby="slotSheetTitle">
    <div class="sheet__inner">
      <div class="sheet__head">
        <h2 id="slotSheetTitle">比較款式</h2>
        <button class="icon-btn" type="button" data-close aria-label="關閉">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="sheet__body" id="slotSheetBody"></div>
    </div>
  </dialog>

  <dialog class="sheet" id="listSheet" aria-labelledby="listSheetTitle">
    <div class="sheet__inner">
      <div class="sheet__head">
        <h2 id="listSheetTitle">我的改裝清單</h2>
        <button class="icon-btn" type="button" data-close aria-label="關閉">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="sheet__body" id="listSheetBody"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
